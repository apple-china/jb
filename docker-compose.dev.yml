name: jiabei-production

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEV_DATABASE_NAME:?DEV_DATABASE_NAME is required}
      POSTGRES_USER: ${DEV_DATABASE_USER:?DEV_DATABASE_USER is required}
      POSTGRES_PASSWORD: ${DEV_DATABASE_PASSWORD:?DEV_DATABASE_PASSWORD is required}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - backend-net
      - db-access-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  backend:
    build: ./src/backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://db:5432/${DEV_DATABASE_NAME:?DEV_DATABASE_NAME is required}
      DATABASE_USER: ${DEV_DATABASE_USER:?DEV_DATABASE_USER is required}
      DATABASE_PASSWORD: ${DEV_DATABASE_PASSWORD:?DEV_DATABASE_PASSWORD is required}

      DINGTALK_ENABLED: ${DINGTALK_ENABLED:-true}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:?DINGTALK_CORP_ID is required}
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:?DINGTALK_CLIENT_ID is required}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:?DINGTALK_CLIENT_SECRET is required}
      DINGTALK_APP_ID: ${DINGTALK_APP_ID:-}
      DINGTALK_AGENT_ID: ${DINGTALK_AGENT_ID:-}
      DINGTALK_SYNC_INTERVAL_MS: ${DINGTALK_SYNC_INTERVAL_MS:-300000}

      MOREDIAN_ENABLED: ${MOREDIAN_ENABLED:-false}
      MOREDIAN_ORG_ID: ${MOREDIAN_ORG_ID:-}
      MOREDIAN_ORG_AUTH_KEY: ${MOREDIAN_ORG_AUTH_KEY:-}
      MOREDIAN_DEVICE_SN: ${MOREDIAN_DEVICE_SN:-}
      MOREDIAN_REQUIRE_SIGNATURE: ${MOREDIAN_REQUIRE_SIGNATURE:-true}
      MOREDIAN_RETENTION_DAYS: ${MOREDIAN_RETENTION_DAYS:-180}
      MOREDIAN_MAX_EVENTS: ${MOREDIAN_MAX_EVENTS:-60000}
      MOREDIAN_CLEANUP_INITIAL_DELAY_MS: ${MOREDIAN_CLEANUP_INITIAL_DELAY_MS:-300000}
      MOREDIAN_CLEANUP_INTERVAL_MS: ${MOREDIAN_CLEANUP_INTERVAL_MS:-604800000}

      DINGTALK_GROUP_OPEN_CONVERSATION_ID: ${DINGTALK_GROUP_OPEN_CONVERSATION_ID:?DINGTALK_GROUP_OPEN_CONVERSATION_ID is required}
      DINGTALK_CARD_TEMPLATE_ID: ${DINGTALK_CARD_TEMPLATE_ID:?DINGTALK_CARD_TEMPLATE_ID is required}
      DINGTALK_LATE_CARD_TEMPLATE_ID: ${DINGTALK_LATE_CARD_TEMPLATE_ID:-}
      APP_ENTRY_URL: ${APP_ENTRY_URL:?APP_ENTRY_URL is required}

      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-}
      SUPER_ADMIN_INITIAL_PASSWORD: ${SUPER_ADMIN_INITIAL_PASSWORD:-}
      SUPER_ADMIN_DINGTALK_USER_ID: ${SUPER_ADMIN_DINGTALK_USER_ID:-}
      SUPER_ADMIN_NICKNAME: ${SUPER_ADMIN_NICKNAME:-Admin}

      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-/app/uploads}
      TZ: Asia/Shanghai
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - uploads-data:/app/uploads
    networks:
      - backend-net
      - outbound-net
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  frontend:
    build:
      context: ./src/frontend
      args:
        VITE_MODE: dev
        DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:?DINGTALK_CLIENT_ID is required}
        DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:?DINGTALK_CORP_ID is required}
        DINGTALK_AUTO_LOGIN: ${DINGTALK_AUTO_LOGIN:-true}
        MOCK_LOGIN_ENABLED: ${MOCK_LOGIN_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    networks:
      backend-net:
      proxy-net:
        aliases:
          - jiabei-dev-frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

volumes:
  postgres-data:
  uploads-data:

networks:
  backend-net:
    internal: true
  outbound-net:
    driver: bridge
  db-access-net:
    driver: bridge
  proxy-net:
    external: true
    name: jiabei-proxy
