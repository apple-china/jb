services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jiabei
      POSTGRES_USER: jiabei
      POSTGRES_PASSWORD: jiabei_local
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - jiabei_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiabei -d jiabei"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./src/backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://db:5432/jiabei
      DATABASE_USER: jiabei
      DATABASE_PASSWORD: jiabei_local
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      UPLOAD_DIRECTORY: /app/uploads
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - jiabei_uploads:/app/uploads

  frontend:
    build:
      context: ./src/frontend
      args:
        VITE_MODE: local
        DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
        DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:-}
        DINGTALK_AUTO_LOGIN: ${DINGTALK_AUTO_LOGIN:-false}
        MOCK_LOGIN_ENABLED: ${MOCK_LOGIN_ENABLED:-true}
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  jiabei_pgdata:
  jiabei_uploads:
